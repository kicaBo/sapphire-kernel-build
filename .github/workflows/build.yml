name: Build Sapphire Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python-is-python3 device-tree-compiler \
            dwarves

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-sapphire-${{ github.ref_name }}
          max-size: 2G

      - name: Download AOSP Clang (Android 16)
        run: |
          git clone --depth=1 -b android16-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/clang
          CLANG_DIR=$(ls -d $HOME/clang/clang-r* | head -n 1)
          echo "Pronadjen Clang u: $CLANG_DIR"
          echo "$CLANG_DIR/bin" >> $GITHUB_PATH

      - name: Clone kernel
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/The-Angel-Place-Sapphire/kernel_xiaomi_sapphire \
            kernel

      - name: Build kernel (Image only)
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          KBUILD_BUILD_USER: kicaBo
          KBUILD_BUILD_HOST: sapphire-build
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"

          rm -rf out && mkdir out
          make O=out vendor/sapphire_defconfig
          make O=out -j$(nproc) Image

          IMG=out/arch/arm64/boot/Image
          [ -f "$IMG" ] || { echo "Image nije napravljen!"; exit 1; }
          
          KREL=$(cat out/include/config/kernel.release)
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "FULL_KREL=$KREL-$GIT_HASH" >> $GITHUB_ENV
          echo "Image size: $(du -h "$IMG" | cut -f1)"

      - name: Package AnyKernel3
        run: |
          # KLONIRAMO WILD KERNELS ANY KERNEL3 (Garantovano radi na OFOX-u)
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3 anykernel
          cd anykernel
          rm -rf .git .github README.md *placeholder*

          # Kopiramo Image
          cp ../kernel/out/arch/arm64/boot/Image ./Image

          # Pisemo nas anykernel.sh sa ispravno escape-ovanim varijablama
          cat <<EOF > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Angel Kernel ${{ env.FULL_KREL }}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=sapphire
          device.name2=sapphiren
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          keycheck.timeout=10
          '; } # end properties

          ### AnyKernel install
          ## boot shell variables
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          # import functions/variables and setup patching
          . tools/ak3-core.sh

          # GKI check (ISPRAVLJENO - escape-ovano da GitHub ne bi citao ove promenljive)
          kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')
          case \$kernel_version in
              5.10*) ksu_supported=true ;;
              5.15*) ksu_supported=true ;;
              6.1*) ksu_supported=true ;;
              6.6*) ksu_supported=true ;;
              6.12*) ksu_supported=true ;;
              *) ksu_supported=false ;;
          esac

          ui_print " " "  -> Angel Kernel Supported: \$ksu_supported"
          \$ksu_supported || abort "  -> Non-GKI device, abort."

          # boot install (POBEDNICKA LOGIKA)
          split_boot

          if [ -f "\$SPLITIMG/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi

          ui_print " "
          ui_print "Angel Kernel successfully flashed!"
          ui_print " "
          EOF

          ZIP_NAME="AngelKernel_sapphire_$(date +%Y%m%d)_${FULL_KREL}.zip"
          zip -r9 "../$ZIP_NAME" . -x '.git*' >/dev/null
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelKernel-sapphire
          path: AngelKernel_sapphire_*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} - ${{ env.FULL_KREL }}
          body: |
            Automatski build za Sapphire/SapphireN
            Kernel: ${{ env.FULL_KREL }}
            Bazirano na: lineage-23.2
          files: AngelKernel_sapphire_*.zip
