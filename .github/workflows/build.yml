name: Build Sapphire Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Build with dabao1955 Action
        uses: dabao1955/kernel_build_action@v1.10.4
        with:
          kernel-url: https://github.com/The-Angel-Place-Sapphire/kernel_xiaomi_sapphire
          kernel-branch: lineage-23.2
          config: vendor/sapphire_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: false                 # <--- ISKLJUČENO: Ne dozvoljavamo Action-u da traži GCC
          android-version: 16             # <--- SADA SE POKLAPA: Tražimo Clang sa Android 16 grane
          aosp-clang-version: r547379
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
